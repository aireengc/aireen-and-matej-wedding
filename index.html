<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aireen & Matej | A Journey to Forever</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --black:#090706;
  --dark:#160c0a;
  --wine:#64131b;
  --red:#8e2430;
  --gold:#c69a4b;
  --gold-light:#e5c77f;
  --cream:#f8f0df;
  --paper:#f5e6c8;
  --brown:#3b2119;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html {
  scroll-behavior:smooth;
}

body {
  background:var(--black);
  color:var(--cream);
  font-family:'Montserrat',sans-serif;
  font-weight:300;
  overflow-x:hidden;
}

body:before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  opacity:.12;
  background-image:
    radial-gradient(#fff .5px,transparent .6px);
  background-size:5px 5px;
}

/* NAVIGATION */

nav {
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:90;
  padding:20px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(
    rgba(5,4,3,.9),
    transparent
  );
}

.logo {
  font-family:'Great Vibes';
  font-size:30px;
  color:var(--gold-light);
  text-decoration:none;
}

.links {
  display:flex;
  gap:25px;
}

.links a {
  color:var(--cream);
  text-decoration:none;
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.menu {
  display:none;
  color:var(--gold-light);
  font-size:24px;
}

/* HERO */

.hero {
  min-height:100vh;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 65% 25%,
      rgba(128,35,42,.35),
      transparent 25%
    ),
    radial-gradient(
      circle at 45% 60%,
      rgba(160,30,45,.18),
      transparent 35%
    ),
    linear-gradient(
      120deg,
      #080605,
      #25110e,
      #080605
    );
}

.hero:before {
  content:"";
  position:absolute;
  inset:0;
  opacity:.25;

  background:
    repeating-linear-gradient(
      100deg,
      transparent 0 80px,
      rgba(220,180,100,.12) 81px 82px
    );
}

.hero-inner {
  position:relative;
  z-index:5;
  width:min(1180px,92%);
  padding:110px 0 60px;
}

.travel-line {
  display:flex;
  align-items:center;
  gap:15px;

  color:var(--gold-light);
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;
}

.travel-line:before,
.travel-line:after {
  content:"";
  height:1px;
  background:rgba(198,154,75,.5);
  flex:1;
}

.hero-grid {
  display:grid;
  grid-template-columns:290px 1fr 330px;
  gap:35px;
  align-items:center;
  margin-top:30px;
}

/* PASSPORT */

.passport {
  height:430px;
  padding:28px 22px;

  background:
    linear-gradient(
      145deg,
      #4b1e1c,
      #170b0a
    );

  border:1px solid rgba(229,199,127,.5);
  border-radius:8px;

  transform:rotate(-7deg);

  box-shadow:
    0 30px 60px rgba(0,0,0,.7),
    inset 0 0 35px rgba(0,0,0,.5);

  position:relative;
  overflow:hidden;
}

.passport:before {
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(229,199,127,.35);
  border-radius:4px;
}

.passport .world {
  font-size:65px;
  color:rgba(229,199,127,.5);
  margin-top:20px;
}

.passport h3 {
  font-family:'Cormorant Garamond';
  font-size:34px;
  letter-spacing:4px;
  color:#ead19b;
  margin-top:15px;
}

.small {
  font-size:8px;
  letter-spacing:3px;
  color:#d6b86f;
}

.passport .script {
  font-family:'Great Vibes';
  font-size:37px;
  color:#eed49c;
  margin-top:75px;
}

.passport .number {
  position:absolute;
  bottom:25px;
  left:25px;

  font:11px monospace;
  letter-spacing:4px;

  color:#d2b875;
}

/* CENTER */

.hero-center {
  text-align:center;
}

.kicker {
  font-size:9px;
  letter-spacing:6px;
  color:var(--gold-light);
  text-transform:uppercase;
}

.hero h1 {
  font-family:'Cormorant Garamond';
  font-weight:400;

  font-size:clamp(65px,9vw,120px);

  line-height:.8;
  letter-spacing:2px;

  margin:35px 0 20px;
}

.hero h1 span {
  font-family:'Great Vibes';
  font-size:.55em;
  color:var(--gold-light);
}

.hero-script {
  font-family:'Great Vibes';
  font-size:45px;
  color:#b73743;
  margin:25px 0;
}

.hero-tag {
  font-size:10px;
  letter-spacing:2px;
  color:#d6c6aa;
}

.flight-path {
  margin:30px auto;

  display:flex;
  align-items:center;
  gap:10px;

  max-width:330px;

  color:var(--gold-light);
}

.flight-path:before,
.flight-path:after {
  content:"";
  flex:1;
  border-top:1px dashed rgba(198,154,75,.6);
}

.gold-button {
  display:inline-block;

  margin-top:25px;

  padding:16px 34px;

  border:1px solid var(--gold);

  background:rgba(30,15,10,.7);

  color:var(--cream);

  text-decoration:none;

  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;

  transition:.3s;
}

.gold-button:hover {
  background:var(--gold);
  color:#160c08;
}

/* BOARDING PASS */

.boarding {
  min-height:350px;

  background:var(--paper);
  color:#24150f;

  padding:25px 22px;

  position:relative;

  transform:rotate(5deg);

  box-shadow:0 30px 55px rgba(0,0,0,.7);

  border-left:12px solid #72202a;
}

.boarding:after {
  content:"";

  position:absolute;
  top:0;
  bottom:0;
  left:-7px;

  border-left:2px dashed #ead9b5;
}

.vip {
  position:absolute;
  right:18px;
  top:18px;

  border:1px solid #8d6a3a;

  padding:6px 9px;

  font-size:8px;
  letter-spacing:2px;
}

.boarding h3 {
  font-family:'Cormorant Garamond';
  font-size:30px;
  letter-spacing:3px;
  margin:8px 0 18px;
}

.pass-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;

  border-top:1px solid rgba(141,106,58,.4);

  padding-top:15px;
}

.pass-grid label {
  display:block;

  font-size:7px;
  letter-spacing:2px;
  text-transform:uppercase;

  color:#765a3b;
}

.pass-grid b {
  display:block;

  font-family:'Cormorant Garamond';
  font-size:21px;

  margin-top:4px;
}

.barcode {
  height:52px;
  margin-top:20px;

  background:
    repeating-linear-gradient(
      90deg,
      #221710 0 2px,
      transparent 2px 5px,
      #221710 5px 6px,
      transparent 6px 9px
    );

  opacity:.75;
}

.stamp {
  display:inline-block;

  margin-top:15px;

  padding:7px 10px;

  border:2px solid #8c3c3d;

  color:#8c3c3d;

  font-size:8px;
  letter-spacing:2px;

  transform:rotate(-5deg);
}

/* SECTIONS */

.section {
  padding:105px 6%;
  position:relative;
}

.dark {
  background:
    linear-gradient(
      180deg,
      #090706,
      #180a09
    );
}

.paper {
  background:var(--paper);
  color:#271711;
}

.section-head {
  text-align:center;
  margin-bottom:50px;
}

.section-kicker {
  font-size:9px;
  letter-spacing:5px;
  text-transform:uppercase;

  color:var(--gold);
}

.paper .section-kicker {
  color:#85402d;
}

h2 {
  font-family:'Cormorant Garamond';
  font-weight:400;

  font-size:clamp(45px,6vw,72px);

  margin:16px 0;
}

.copy {
  max-width:690px;
  margin:auto;

  font-size:13px;
  line-height:2;

  color:#bfb09b;
}

.paper .copy {
  color:#654c3b;
}

/* TICKETS */

.ticket-row {
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:30px;

  max-width:1050px;

  margin:auto;
}

.ticket {
  background:#f6e7c7;

  color:#24160f;

  padding:38px;

  position:relative;

  border:1px solid #b7955b;

  box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.ticket:before,
.ticket:after {
  content:"";

  position:absolute;

  width:22px;
  height:22px;

  background:var(--paper);

  border-radius:50%;

  top:50%;

  transform:translateY(-50%);
}

.ticket:before {
  left:-12px;
}

.ticket:after {
  right:-12px;
}

.ticket h3 {
  font-family:'Cormorant Garamond';
  font-size:34px;
  font-weight:500;
}

.ticket .route {
  display:flex;
  align-items:center;
  gap:12px;

  margin:22px 0;

  color:#8a5b35;
}

.ticket .route:before,
.ticket .route:after {
  content:"";

  flex:1;

  border-top:1px dashed #8a5b35;
}

.ticket-info {
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:18px;

  border-top:1px solid rgba(170,140,95,.4);

  padding-top:20px;
}

.ticket-info span {
  display:block;

  font-size:7px;
  letter-spacing:2px;
  text-transform:uppercase;

  color:#85684c;
}

.ticket-info strong {
  font-family:'Cormorant Garamond';
  font-size:21px;
  font-weight:500;
}

/* ITINERARY */

.timeline {
  max-width:1050px;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  position:relative;
}

.timeline:before {
  content:"";

  position:absolute;

  top:28px;
  left:7%;
  right:7%;

  border-top:1px dashed rgba(198,154,75,.6);
}

.stop {
  text-align:center;
  position:relative;
}

.circle {
  width:55px;
  height:55px;

  border:1px solid var(--gold);

  border-radius:50%;

  display:grid;
  place-items:center;

  margin:0 auto 20px;

  background:#0d0807;

  color:var(--gold-light);

  position:relative;
  z-index:2;
}

.stop h3 {
  font-family:'Cormorant Garamond';
  font-size:28px;
}

.stop p {
  font-size:9px;
  letter-spacing:2px;
  color:#b7a994;

  margin-top:7px;

  text-transform:uppercase;
}

/* TRAVEL */

.map-card {
  max-width:1000px;

  margin:auto;

  min-height:330px;

  padding:55px;

  border:1px solid rgba(198,154,75,.35);

  background:
    repeating-linear-gradient(
      35deg,
      transparent 0 48px,
      rgba(198,154,75,.05) 49px 50px
    ),
    #100a08;

  position:relative;
  overflow:hidden;
}

.route-map {
  height:130px;

  position:relative;

  margin:25px 0;

  border-top:1px dashed rgba(198,154,75,.4);
  border-bottom:1px dashed rgba(198,154,75,.4);
}

.route-line {
  position:absolute;

  left:25%;
  right:20%;
  top:62px;

  border-top:1px dashed var(--gold);
}

.route-map:before {
  content:"✈";

  position:absolute;

  left:22%;
  top:43px;

  color:var(--gold-light);

  font-size:25px;

  transform:rotate(20deg);
}

.route-map:after {
  content:"♥";

  position:absolute;

  right:17%;
  top:43px;

  color:#a92e3a;

  font-size:25px;
}

/* COUNTDOWN */

.countdown {
  display:flex;
  justify-content:center;
  gap:55px;
  margin-top:38px;
}

.time {
  text-align:center;
}

.time strong {
  display:block;

  font-family:'Cormorant Garamond';
  font-size:52px;
  font-weight:400;

  color:#f1dfbb;
}

.time span {
  font-size:8px;
  letter-spacing:3px;

  color:var(--gold);
}

/* RSVP */

.rsvp {
  min-height:600px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    radial-gradient(
      circle at center,
      rgba(100,20,30,.3),
      transparent 55%
    ),
    #090706;
}

.rsvp .passport {
  transform:rotate(-2deg);

  width:min(500px,90vw);

  height:auto;

  min-height:350px;
}

/* FOOTER */

.footer {
  text-align:center;

  padding:65px 20px;

  background:#050403;

  border-top:1px solid rgba(198,154,75,.3);
}

.footer .logo {
  font-size:38px;
}

.footer p {
  font-size:9px;
  letter-spacing:2px;
  color:#8f8374;

  margin-top:12px;
}

/* MOBILE */

@media(max-width:900px) {

  .hero-grid {
    grid-template-columns:1fr;
    max-width:520px;
    margin:auto;
  }

  .passport,
  .boarding {
    display:none;
  }

  .hero-inner {
    padding-top:110px;
  }

  .ticket-row {
    grid-template-columns:1fr;
  }

  .timeline {
    grid-template-columns:1fr 1fr;
    gap:35px;
  }

  .timeline:before {
    display:none;
  }

}

@media(max-width:600px) {

  nav .links {
    display:none;
  }

  .menu {
    display:block;
  }

  .section {
    padding:80px 20px;
  }

  .hero h1 {
    font-size:70px;
  }

  .hero-script {
    font-size:39px;
  }

  .countdown {
    gap:17px;
  }

  .time strong {
    font-size:36px;
  }

  .ticket {
    padding:28px 22px;
  }

  .map-card {
    padding:35px 20px;
  }

}

</style>
</head>
